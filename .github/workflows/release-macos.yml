name: Release macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_ARCH: arm64
      ELECTRON_CACHE: /tmp/imessage-pdf-electron-cache

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm test
      - run: pnpm lint
      - run: pnpm run electron:build

      - name: Verify packaged runtime
        run: |
          APP="dist-electron/mac-arm64/iMessage PDF Exporter.app"
          test -x "$APP/Contents/Resources/node"
          test "$("$APP/Contents/Resources/node" --version)" = "v24.18.1"
          test -f "$APP/Contents/Resources/app/.next/standalone/server.js"
          "$APP/Contents/Resources/node" -e \
            "require('module').createRequire(process.argv[1])('sharp')" \
            "$PWD/$APP/Contents/Resources/app/.next/standalone/server.js"
          codesign --verify --deep --strict --verbose=2 "$APP"
          test "$(defaults read "$APP/Contents/Info" CFBundleIdentifier)" = "com.imessagepdf.exporter"
          codesign -dr - "$APP" 2>&1 | grep -q 'designated => identifier "com.imessagepdf.exporter"'

      - name: Smoke-test packaged app
        run: |
          APP="dist-electron/mac-arm64/iMessage PDF Exporter.app"
          ELECTRON_SMOKE=1 \
            IMESSAGE_PDF_APP_DB_PATH="$RUNNER_TEMP/imessage-pdf-smoke.db" \
            IMESSAGE_PDF_IMAGE_CACHE_DIR="$RUNNER_TEMP/imessage-pdf-preview-cache" \
            "$APP/Contents/MacOS/iMessage PDF Exporter" > smoke.log 2>&1 &
          PID=$!
          for i in {1..60}; do
            if ! kill -0 "$PID" 2>/dev/null; then
              wait "$PID"
              grep -q '\[smoke\].*hasContent=true' smoke.log
              cat smoke.log
              exit 0
            fi
            sleep 1
          done
          cat smoke.log
          kill "$PID" 2>/dev/null || true
          exit 1

      - name: Write checksums
        run: shasum -a 256 dist-electron/*.dmg > dist-electron/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: imessage-pdf-macos-arm64
          path: |
            dist-electron/*.dmg
            dist-electron/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist-electron/*.dmg
            dist-electron/SHA256SUMS.txt
